<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veille Emploi</title>
<meta name="robots" content="noindex">
<meta name="description" content="Dépose ton CV une fois, reçois tous les 2 jours les offres qui te correspondent.">
<meta name="theme-color" content="#161a3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veille Emploi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="workspace.css">
</head>
<body>
<header class="top">
  <button class="icon-btn plain mobile-menu" id="mobileMenu" type="button" hidden aria-controls="bottomNav" aria-expanded="false" data-i18n-aria="menuLabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="brand brand-home" id="brandHome" href="./" data-i18n-aria="brandHomeLabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/></svg> <span>Veille Emploi</span></a>
  <form id="headerSearch" class="global-search" hidden role="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="globalQuery" type="search" data-i18n-ph="searchOffersPh" data-i18n-aria="searchOffersPh"><button type="submit" class="search-go" data-i18n="searchOffers"></button></form>
  <div class="top-actions">
    <button id="installBtn" class="ghost" type="button" hidden data-i18n="install"></button>
    <button id="headerAlerts" class="icon-btn plain" type="button" hidden data-i18n-aria="navAlerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 20h4"/></svg></button>
    <button id="settingsBtn" class="icon-btn plain" type="button" data-i18n-aria="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></button>
    <button id="profileBtn" class="profile-btn" type="button" hidden data-i18n-aria="settings"><span id="profileInitials"></span></button>
  </div>
</header>

<main class="wrap">
  <p class="banner" id="banner" role="status" hidden></p>
  <div id="iosHint" class="hint" hidden data-i18n-html="iosHint"></div>

  <section id="landing" class="landing" hidden>
    <h1 data-i18n="lTitle"></h1>
    <p class="lead" data-i18n="lLead"></p>
    <ol class="steps">
      <li><b data-i18n="l1t"></b><span data-i18n="l1"></span></li>
      <li><b data-i18n="l2t"></b><span data-i18n="l2"></span></li>
      <li><b data-i18n="l3t"></b><span data-i18n="l3"></span></li>
      <li><b data-i18n="l4t"></b><span data-i18n="l4"></span></li>
    </ol>
    <div class="any-mail" role="note">
      <span class="any-mail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
      <div><b data-i18n="anyMailT"></b><span data-i18n="anyMail"></span></div>
    </div>
    <button class="primary big" id="startBtn" type="button" data-i18n="start"></button>
    <p class="small center" data-i18n="lFoot"></p>
    <button class="link-btn-plain center-self" id="haveAccount" type="button" data-i18n="haveAccount"></button>
  </section>

  <section id="signin" class="card signin" hidden>
    <div id="emailStep">
      <form id="emailForm" class="stack" novalidate>
        <h2 data-i18n="siTitle"></h2>
        <p class="small" data-i18n="siHelp"></p>
        <input id="loginEmail" type="email" autocomplete="email" inputmode="email" data-i18n-ph="siEmailPh" data-i18n-aria="siTitle">
        <button class="primary" id="sendCode" type="submit" data-i18n="sendCode"></button>
      </form>
    </div>
    <div id="codeStep" hidden>
      <form id="codeForm" class="stack" novalidate>
        <h2 data-i18n="codeTitle"></h2>
        <p class="small" id="codeSent"></p>
        <input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" data-i18n-aria="codeTitle">
        <button class="primary" id="verifyBtn" type="submit" data-i18n="verify"></button>
        <div class="row-links"><button class="link-btn-plain" id="resendBtn" type="button" data-i18n="resend"></button><button class="link-btn-plain" id="changeEmail" type="button" data-i18n="changeEmail"></button></div>
      </form>
    </div>
    <p class="err" id="loginErr" hidden role="alert"></p>
    <button class="link-btn-plain" id="backHome" type="button" data-i18n="back"></button>
  </section>

  <section id="dashboardView" class="dashboard stack-lg" hidden>
    <div class="welcome-hero"><div class="welcome-copy"><h1 id="welcomeTitle"></h1><p data-i18n="welcomeLead"></p></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 340 155" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="screenPaint" x2="1" y2="1"><stop stop-color="#303c8a"/><stop offset="1" stop-color="#121945"/></linearGradient><linearGradient id="leafPaint" x2="1" y2="1"><stop stop-color="#91d978"/><stop offset="1" stop-color="#26865d"/></linearGradient></defs><ellipse cx="170" cy="143" rx="155" ry="8" fill="#12143e" opacity=".3"/><path d="M36 113 53 30q1-6 8-6h157q8 0 7 8l-13 81Z" fill="#171d4e" stroke="#8189e7" stroke-width="3"/><path d="M55 36h155l-11 67H43Z" fill="url(#screenPaint)"/><path d="m15 116 197 0 35 11q4 6-7 8H20q-17-1-5-19Z" fill="#c1c9ff"/><path d="M15 126h232l-7 9H20Z" fill="#737dc6"/><path d="M266 107c-4-38-23-63-13-72 18 4 23 34 22 54 0-44 18-77 29-71 10 12-7 50-21 72 15-21 38-26 40-16 0 12-25 27-41 32" fill="url(#leafPaint)"/><path d="M249 105h55l-8 35h-39Z" fill="#f0edff"/><path d="M249 105h55l-2 8h-51Z" fill="#c8c9f2"/><rect x="315" y="112" width="18" height="26" rx="6" fill="#f5f1ff"/><path d="M333 118q10 0 7 8-2 4-7 4" fill="none" stroke="#e4e1ff" stroke-width="3"/></svg></div></div>
    <div class="dash-metrics"><article class="dash-metric card"><span class="metric-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span><div><b id="dashRecv">—</b><span data-i18n="dashTracked"></span></div><small id="dashWeek" class="metric-note"></small></article><article class="dash-metric card"><span class="metric-icon indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 9-18 9 4-9-4-9Zm4 9h14"/></svg></span><div><b id="dashApp">—</b><span data-i18n="stApp"></span></div><small id="dashResponses" class="metric-note"></small></article><article class="dash-metric card"><span class="metric-icon coral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 20h4"/></svg></span><div><b id="dashAlert">—</b><span data-i18n="dashActiveAlerts"></span></div><small id="dashLocation" class="metric-note"></small></article><article class="dash-metric card"><span class="metric-icon violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><div><b id="dashImported">—</b><span data-i18n="dashImports"></span></div><small id="dashImportNote" class="metric-note"></small></article></div>
    <section class="card quick-search"><h2 data-i18n="dashSearchTitle"></h2><form id="dashSearchForm" class="quick-grid" role="search"><div class="quick-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="dashQuery" type="search" data-i18n-ph="searchOffersPh" data-i18n-aria="searchOffersPh"></div><button id="dashLocationBtn" type="button" class="ghost criteria-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/></svg><span id="dashLocationText"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button type="button" class="ghost criteria-btn" id="dashCriteriaBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/></svg><span data-i18n="editCriteria"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button class="primary" type="submit" data-i18n="searchOffers"></button></form></section>
    <div class="dash-lower"><section class="card dash-recent"><div class="section-heading"><h2 data-i18n="recentOffers"></h2><button class="link-btn-plain" type="button" id="allRecent" data-i18n="viewAll"></button></div><div id="dashRecent"></div></section><section class="card dash-progress"><div class="section-heading"><h2 data-i18n="navApplications"></h2><button class="link-btn-plain" type="button" id="allApps" data-i18n="viewAll"></button></div><div id="dashPipeline"></div></section></div>
  </section>
  <div id="appView" class="stack-lg" hidden>
  <div class="page-heading"><h1 data-i18n="navAlerts"></h1><p class="small" data-i18n="alertsLead"></p></div>
  <p class="beta" role="note" data-i18n-html="beta"></p>

  <section class="card status" aria-live="polite">
    <div id="statusOff">
      <span class="pill off" data-i18n="inactive">INACTIF</span>
      <p data-i18n="statusOff"></p>
    </div>
    <div id="statusOn" hidden>
      <span class="pill on" data-i18n="active">ACTIF</span>
      <p><span data-i18n="nextEmail"></span> <b id="nextDate">—</b><span id="freqText"></span></p>
      <p class="small"><span data-i18n="sentTo"></span> <span id="sentTo">—</span> · <span id="maxText"></span></p>
    </div>
  </section>

  <form id="form" novalidate>
    <section class="card">
      <h2><span class="num">1</span> <span data-i18n="cvTitle"></span></h2>
      <div class="drop" id="drop">
        <div class="file" id="fileRow" hidden><span class="pdf">PDF</span><span id="fileName"></span></div>
        <p class="small" id="fileEmpty" data-i18n="cvEmpty"></p>
        <label class="btn-file" for="cv"><span id="cvLabel"></span><input id="cv" name="cv" type="file" accept="application/pdf,.pdf"></label>
        <p class="small" data-i18n="cvLocal"></p>
      </div>
      <div id="cvReading" class="reading" hidden><span class="spinner" aria-hidden="true"></span><span data-i18n="cvReading"></span></div>
      <div id="cvFound" class="found" hidden></div>
      <p class="err" id="cvErr" hidden></p>
    </section>

    <section class="card">
      <h2><span class="num">2</span> <span data-i18n="prefsTitle"></span></h2>
      <div class="grid2">
        <label for="prenom"><span data-i18n="firstName"></span><input id="prenom" name="prenom" autocomplete="name" data-i18n-ph="firstNamePh"></label>
        <label for="email"><span data-i18n="email"></span><input id="email" name="email" type="email" autocomplete="email" readonly data-i18n-ph="emailPh"></label>
      </div>

      <div class="field">
        <label for="roleInput" data-i18n="roles"></label>
        <div class="chips" id="roleChips"><input id="roleInput" autocomplete="off" data-i18n-ph="rolesPh"></div>
        <div class="suggest" id="roleSuggest" hidden><span class="small" data-i18n="fromCv"></span><div class="sugg-row" id="roleSuggestRow"></div></div>
        <p class="small" data-i18n="rolesHelp"></p>
      </div>

      <div class="field" id="locField">
        <span class="field-label" id="locLabel" data-i18n="location"></span>
        <div class="loc-dd" id="locDd">
          <button type="button" class="loc-trigger" id="locTrigger" aria-expanded="false" aria-controls="locPanel" aria-labelledby="locLabel locTriggerText">
            <span id="locTriggerText" class="trigger-text"></span>
            <svg class="trigger-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="loc-panel" id="locPanel" hidden>
            <div class="loc-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <input id="locSearch" autocomplete="off" data-i18n-ph="locSearchPh" data-i18n-aria="location">
              <button type="button" class="clear" id="locClear" hidden data-i18n-aria="clearSearch" aria-label="Effacer">×</button>
            </div>
            <div class="loc-summary" id="locSummary" hidden>
              <div class="sum-head"><span class="sum-title" data-i18n="sumTitle"></span></div>
              <div id="locSumRows" class="sum-rows"></div>
            </div>
            <div class="loc-list" id="locList"></div>
            <div class="loc-foot"><button type="button" class="link-btn-plain" id="locReset" hidden data-i18n="reset"></button><button type="button" class="primary small-btn" id="locDone" data-i18n="ok">OK</button></div>
          </div>
        </div>
      </div>

      <div class="grid3">
        <label for="salaire"><span data-i18n="salary"></span>
          <select id="salaire" name="salaire"><option value=""></option><option value="25-35"></option><option value="35-45"></option><option value="45-55"></option><option value="55-65"></option><option value="65-80"></option><option value="80-100"></option><option value="100+"></option></select></label>
        <label for="teletravail"><span data-i18n="remote"></span>
          <select id="teletravail" name="teletravail"><option value="hybrid"></option><option value="onsite"></option><option value="remote"></option></select></label>
        <label for="contrat"><span data-i18n="contract"></span>
          <select id="contrat" name="contrat"><option value="cdi"></option><option value="cdi_cdd"></option><option value="cdi_free"></option><option value="all"></option></select></label>
      </div>
      <p class="small" data-i18n="salaryHelp"></p>
      <div class="field">
        <span class="field-label" id="exLabel" data-i18n="exclude"></span>
        <div class="loc-dd" id="exDd">
          <button type="button" class="loc-trigger" id="exTrigger" aria-expanded="false" aria-controls="exPanel" aria-labelledby="exLabel exTriggerText">
            <span id="exTriggerText" class="trigger-text"></span>
            <svg class="trigger-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="loc-panel" id="exPanel" hidden>
            <div class="loc-list ex-list" id="excludeTags"></div>
            <div class="ex-other"><label for="exclure"><span data-i18n="excludeOther"></span><input id="exclure" name="exclure" data-i18n-ph="excludePh"></label></div>
            <div class="loc-foot"><button type="button" class="link-btn-plain" id="exReset" data-i18n="reset"></button><button type="button" class="primary small-btn" id="exDone" data-i18n="ok">OK</button></div>
          </div>
        </div>
      </div>
      <p class="err" id="formErr" hidden></p>
    </section>

    <section class="card">
      <h2><span class="num">3</span> <span data-i18n="alertTitle"></span></h2>
      <fieldset class="group">
        <legend data-i18n="sourcesTitle"></legend>
        <div class="checks" id="sources"></div>
        <p class="small" data-i18n="sourcesHelp"></p>
      </fieldset>
      <fieldset class="group">
        <legend data-i18n="sinceTitle"></legend>
        <div class="radios" id="since">
          <label><input type="radio" name="since" value="1"> <span data-i18n="since1"></span></label>
          <label><input type="radio" name="since" value="3"> <span data-i18n="since3"></span></label>
          <label><input type="radio" name="since" value="7"> <span data-i18n="since7"></span></label>
        </div>
      </fieldset>
    </section>

    <section class="card">
      <label class="consent" for="consent"><input id="consent" name="consent" type="checkbox"> <span data-i18n="consent"></span></label>
      <div class="actions">
        <button class="primary" id="activate" type="submit"></button>
        <button class="ghost" id="pause" type="button" hidden data-i18n="pause"></button>
      </div>
    </section>
  </form>

  <section class="card" id="preview" hidden>
    <h2 data-i18n="previewTitle"></h2>
    <div class="mail">
      <div class="mail-head"><b id="mailSubject"></b><span class="small" data-i18n="previewNote"></span></div>
      <div class="mail-body">
        <p id="mailHello"></p>
        <ul class="offers" id="offers"></ul>
        <div id="linksBox" class="links" hidden>
          <b data-i18n="linksTitle"></b>
          <p class="small" data-i18n="linksHelp"></p>
          <div class="link-row" id="links"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="card quiet">
    <h2 data-i18n="dataTitle"></h2>
    <p class="small" data-i18n="dataNote"></p>
    <div class="actions">
      <button class="danger" id="wipe" type="button" data-i18n="wipe"></button>
      <span class="small" id="wipeMsg" hidden data-i18n="wiped"></span>
    </div>
  </section>
  </div>

  <div id="offersView" class="stack-lg" hidden>
    <div class="row-between history-heading"><h1 class="pg" id="historyTitle" data-i18n="myOffers"></h1>
      <div class="seg" id="period" role="group" data-i18n-aria="period">
        <button type="button" data-p="7" data-i18n="p7"></button><button type="button" data-p="30" data-i18n="p30"></button><button type="button" data-p="all" data-i18n="pAll"></button>
      </div></div>
    <div class="offer-actions" id="historyActions">
      <button type="button" class="primary small-btn" id="refreshOffersBtn" data-i18n="refreshOffers"></button>
      <button type="button" class="ghost" id="exportBtn" data-i18n="export"></button>
    </div>
    <div class="row-between" id="historyMessages"><p class="small" id="refreshOffersMsg" role="status" hidden></p><button type="button" class="link-btn-plain" id="addOfferBtn" data-i18n="addManual"></button></div>
    <section class="card tight" id="mailImportCard" hidden>
      <h3 class="h3" data-i18n="mailImportTitle"></h3>
      <p class="small" id="mailImportState" role="status"></p>
      <div id="mailImportSection" hidden>
        <p class="small" data-i18n="mailImportHelp"></p>
        <p class="small"><a href="https://support.google.com/mail/answer/6579" target="_blank" rel="noopener noreferrer" data-i18n="mailImportGuide"></a></p>
        <label class="check"><input type="checkbox" id="mailImportEnabled"><span data-i18n="mailImportEnable"></span></label>
        <p class="small" id="mailImportMsg" role="status" hidden></p>
      </div>
    </section>
    <details class="card tight fwd-card" id="fwdCard" hidden>
      <summary><span aria-hidden="true">📨</span> <span data-i18n="fwdT"></span></summary>
      <p class="small" id="fwdHelp"></p>
      <div class="fwd-row"><code id="fwdAddr"></code><button type="button" class="ghost small-btn" id="fwdCopy" data-i18n="fwdCopy"></button></div>
      <p class="small good-text" id="fwdMsg" hidden data-i18n="fwdCopied"></p>
      <p class="small" data-i18n="fwdHow"></p>
    </details>
    <div class="stats" id="historyStats">
      <div class="stat"><b id="stRecv">0</b><span data-i18n="stRecv"></span><em id="stWeek"></em></div>
      <div class="stat"><b id="stOpen">0</b><span data-i18n="stOpen"></span></div>
      <div class="stat"><b id="stApp">0</b><span data-i18n="stApp"></span></div>
      <div class="stat"><b id="stInt">0</b><span data-i18n="stInt"></span><em id="stRate"></em></div>
    </div>
    <div class="history-content" id="historyContent"><div class="history-list-column" id="historyListColumn">
    <div class="history-search" id="historySearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="offerQuery" type="search" data-i18n-ph="searchOffersPh" data-i18n-aria="searchOffersPh"><button id="clearOfferQuery" type="button" class="link-btn-plain" data-i18n="reset"></button></div>
    <div class="tabs" id="offerTabs" role="tablist">
      <button type="button" data-f="all"></button><button type="button" data-f="new"></button><button type="button" data-f="applied"></button><button type="button" data-f="interview"></button><button type="button" data-f="rejected"></button>
    </div>
    <div id="offerList" class="offer-list"></div>
    <p class="small center" id="offersEmpty" hidden></p>
    <p class="small center" id="offersLoading" hidden data-i18n="loading"></p>
    </div><aside class="history-insights" id="historyInsights">
    <section class="card tight" id="historyFunnel"><h3 class="h3" data-i18n="funnel"></h3><div class="funnel" id="funnel"></div></section>

    </aside></div>
  </div>
</main>

<dialog id="offerSheet" class="bottom-sheet" aria-labelledby="osTitle">
  <div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <div class="detail-head"><button class="icon-btn plain" id="osBack" type="button" data-i18n-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><span data-i18n="offerDetail"></span></div>
    <div class="detail-company" id="osCompanyIcon" aria-hidden="true"></div>
    <div><h2 id="osTitle"></h2><p class="small" id="osMeta"></p></div>
    <p class="small" id="osDate"></p><a class="primary btn-link" id="osLink" target="_blank" rel="noopener"></a>
    <span class="small strong" data-i18n="whereAt"></span>
    <div class="st-opts" id="osOpts">
      <button type="button" data-st="applied"></button><button type="button" data-st="interview"></button>
      <button type="button" data-st="rejected"></button><button type="button" data-st="notforme"></button>
    </div>
    <p class="small center" data-i18n="tapNote"></p>
    <button class="ghost" type="button" id="osClose" data-i18n="close"></button>
    <button class="link-btn-plain danger-link center-self" type="button" id="osDelete" data-i18n="deleteOffer"></button>
  </div>
</dialog>

<dialog id="addSheet" class="bottom-sheet" aria-labelledby="addTitle">
  <form class="sheet" id="addForm" novalidate>
    <div class="grab" aria-hidden="true"></div>
    <h2 id="addTitle" data-i18n="addApp"></h2>
    <p class="small" data-i18n="addHelp"></p>
    <label for="addJob"><span data-i18n="addJob"></span><input id="addJob" required maxlength="200" autocomplete="off" data-i18n-ph="addJobPh"></label>
    <label for="addCompany"><span data-i18n="addCompany"></span><input id="addCompany" maxlength="120" autocomplete="organization" data-i18n-ph="addCompanyPh"></label>
    <label for="addUrl"><span data-i18n="addUrl"></span><input id="addUrl" type="url" inputmode="url" maxlength="1000" placeholder="https://"></label>
    <div class="grid2">
      <label for="addDate"><span data-i18n="addDate"></span><input id="addDate" type="date"></label>
      <label for="addStatus"><span data-i18n="addStatus"></span>
        <select id="addStatus"><option value="applied"></option><option value="interview"></option><option value="rejected"></option><option value="new"></option></select></label>
    </div>
    <p class="err" id="addErr" hidden role="alert"></p>
    <div class="actions"><button class="primary" type="submit" id="addSave" data-i18n="save"></button><button class="ghost" type="button" id="addCancel" data-i18n="cancel"></button></div>
  </form>
</dialog>

<dialog id="exportSheet" class="bottom-sheet" aria-labelledby="exportTitle">
  <div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="exportTitle" data-i18n="exportTitle"></h2>
    <p class="small" data-i18n="exportHelp"></p>
    <button class="primary" type="button" id="exportPdf" data-i18n="exportPdf"></button>
    <button class="ghost" type="button" id="exportCsv" data-i18n="exportCsv"></button>
    <button class="link-btn-plain center-self" type="button" id="exportClose" data-i18n="close"></button>
  </div>
</dialog>

<div id="printArea" class="print-area" aria-hidden="true"></div>

<dialog id="confirm" aria-labelledby="confirmTitle">
  <form method="dialog" class="sheet">
    <div class="confirm-head">
      <span class="confirm-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h2 id="confirmTitle"></h2>
    </div>
    <dl class="confirm-list" id="confirmList"></dl>
    <p class="confirm-note" id="confirmNote"></p>
    <button class="primary" value="close" id="confirmOk" data-i18n="cSeePreview"></button>
  </form>
</dialog>

<dialog id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="settingsTitle" data-i18n="settings"></h2>
      <button class="icon-btn plain" value="close" data-i18n-aria="close" aria-label="Fermer">✕</button>
    </div>
    <label for="setLang"><span data-i18n="language"></span>
      <select id="setLang"><option value="fr">Français</option><option value="en">English</option></select></label>
    <label for="setFreq"><span data-i18n="frequency"></span>
      <select id="setFreq"><option value="1"></option><option value="2"></option><option value="7"></option></select></label>
    <div class="grid2">
      <label for="setHour"><span data-i18n="sendTime"></span>
        <select id="setHour"><option>07:00</option><option>07:45</option><option>12:00</option><option>18:00</option></select></label>
      <label for="setMax"><span data-i18n="maxOffers"></span>
        <select id="setMax"><option>5</option><option>8</option><option>10</option></select></label>
    </div>
    <label for="setTheme"><span data-i18n="theme"></span>
      <select id="setTheme"><option value="auto"></option><option value="light"></option><option value="dark"></option></select></label>
    <div id="accountBox" class="account-box" hidden>
      <div class="share" id="inviteShareBox">
        <b data-i18n="shareTitle"></b>
        <p class="small" data-i18n="shareHelp"></p>
        <div class="share-row">
          <button class="primary small-btn" id="shareBtn" type="button" data-i18n="share"></button>
          <a class="ghost share-btn" id="shareWa" target="_blank" rel="noopener">WhatsApp</a>
          <a class="ghost share-btn" id="shareSms">SMS</a>
          <button class="ghost" id="copyLink" type="button" data-i18n="copy"></button>
        </div>
        <span class="small ok-msg" id="copyMsg" hidden data-i18n="copied"></span>
      </div>
      <div class="acct-row"><span class="small"><span data-i18n="account"></span> : <b id="accountEmail"></b></span><button class="link-btn-plain" id="logoutBtn" type="button" data-i18n="logout"></button></div>
    </div>
    <button class="primary" value="close" data-i18n="done"></button>
  </form>
</dialog>
