name: Matching regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/*.test.mjs
